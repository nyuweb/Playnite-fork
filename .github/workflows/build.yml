name: build
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options: [Release, Debug]
        default: Release
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install powershell-yaml
        shell: pwsh
        run: Install-Module powershell-yaml -Force -Scope CurrentUser
      - name: Build and package
        shell: pwsh
        env:
          LICENSED_DEPS_URL: ${{ secrets.LICENSED_DEPENDENCIES_URL }}
        run: |
          $params = @{
            Configuration = "${{ inputs.configuration }}"
            Package = $true
            MSBuildPath = (Get-Command msbuild).Source
          }
          if ($env:LICENSED_DEPS_URL) { $params.LicensedDependenciesUrl = $env:LICENSED_DEPS_URL }
          ./build/build.ps1 @params
      - uses: actions/upload-artifact@v4
        with:
          name: playnite-${{ inputs.configuration }}
          path: build/Playnite.zip
          if-no-files-found: error
