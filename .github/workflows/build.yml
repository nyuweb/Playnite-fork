name: build
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        options: [Release, Debug]
        default: Release
      test_filter:
        description: "Optional dotnet test filter for Playnite.Tests (e.g. FullyQualifiedName~SettingsTests). Empty = no tests"
        type: string
        default: ""
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Install powershell-yaml
        shell: pwsh
        run: Install-Module powershell-yaml -Force -Scope CurrentUser
      - name: Build and package
        shell: pwsh
        env:
          LICENSED_DEPS_URL: ${{ secrets.LICENSED_DEPENDENCIES_URL }}
        run: |
          $params = @{
            Configuration = "${{ inputs.configuration }}"
            Package = $true
            MSBuildPath = (Get-Command msbuild).Source
          }
          if ($env:LICENSED_DEPS_URL) { $params.LicensedDependenciesUrl = $env:LICENSED_DEPS_URL }
          ./build/build.ps1 @params
      - name: Run unit tests
        if: ${{ inputs.test_filter != '' }}
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem source/Tests/Playnite.Tests/bin -Recurse -Filter Playnite.Tests.dll)
          $dlls | ForEach-Object { Write-Host "Found: $($_.FullName)" }
          if ($dlls.Count -eq 0) { throw "Playnite.Tests.dll not found" }
          dotnet test $dlls[0].FullName --filter "${{ inputs.test_filter }}"
      - uses: actions/upload-artifact@v4
        with:
          name: playnite-${{ inputs.configuration }}
          path: build/Playnite.zip
          if-no-files-found: error
